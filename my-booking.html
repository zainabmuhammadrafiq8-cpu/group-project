<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0">

<title>
My Bookings | Glamora
</title>

<link
rel="stylesheet"
href="./style.css">

</head>


<body>


<!-- ================= NAVBAR ================= -->

<nav class="navbar">

    <div class="logo">

        Glamora<span>.</span>

    </div>


    <div class="nav-actions">

        <a
        href="index.html"
        class="btn btn-outline">

            Home

        </a>


        <button
        id="logoutBtn"
        class="btn btn-outline"
        style="display:none">

            Logout

        </button>

    </div>

</nav>



<main class="container fade-in">


<section style="padding:60px 0">


<h1 class="section-title">

    My Bookings

</h1>


<p class="page-description">

    Sign in to view and manage your appointments.

</p>



<!-- ================= LOGIN / SIGNUP ================= -->

<div
id="guestView"
class="glass guest-card">


    <div class="login-icon">

        ✦

    </div>


    <h2 id="authTitle">

        Welcome to Glamora

    </h2>


    <p id="authDescription">

        Sign in to view your beauty appointments.

    </p>



    <!-- ================= FORM ================= -->

    <form id="authForm">


        <input
        id="email"
        class="input"
        type="email"
        placeholder="Email Address"
        required>


        <input
        id="password"
        class="input"
        type="password"
        placeholder="Password"
        required>


        <button
        id="authSubmitBtn"
        type="submit"
        class="btn btn-gradient">

            Sign In

        </button>


    </form>



    <!-- ================= DIVIDER ================= -->

    <div class="auth-divider">

        OR

    </div>



    <!-- ================= GOOGLE ================= -->

    <button
    id="googleBtn"
    type="button"
    class="btn btn-outline google-btn">

        🔵 Continue with Google

    </button>



    <!-- ================= SWITCH ================= -->

    <p class="switch-auth">

        <span id="switchText">

            Don't have an account?

        </span>


        <button
        id="switchBtn"
        type="button">

            Create Account

        </button>

    </p>



    <p id="authMessage"></p>


</div>



<!-- ================= BOOKINGS VIEW ================= -->

<div
id="bookingView"
style="display:none">


<!-- USER INFO -->

<div class="glass user-welcome">


    <div>

        <h2>

            Welcome Back ✨

        </h2>


        <p id="userEmail">

        </p>


    </div>



    <a
    href="index.html#booking"
    class="btn btn-gradient">

        + New Booking

    </a>


</div>



<!-- BOOKINGS -->

<div class="glass bookings-card">


    <div class="booking-header">


        <div>

            <h2>

                My Appointments

            </h2>


            <p>

                Your booked beauty services

            </p>

        </div>



        <button
        id="refreshBtn"
        class="btn btn-outline">

            ↻ Refresh

        </button>


    </div>



    <div class="table-wrapper">


        <table>


            <thead>

                <tr>

                    <th>
                        Booking ID
                    </th>


                    <th>
                        Service
                    </th>


                    <th>
                        Staff
                    </th>


                    <th>
                        Date
                    </th>


                    <th>
                        Time
                    </th>


                    <th>
                        Status
                    </th>

                </tr>

            </thead>



            <tbody id="bookingTable">

            </tbody>


        </table>


    </div>


</div>


</div>


</section>


</main>



<!-- ================= STYLES ================= -->

<style>

    -10px;

    35px;

    align-items:center;

/* AUTH */

    margin:auto;

    align-items:center;

<!-- ================= FIREBASE ================= -->

<script type="module">


/* ================= FIREBASE IMPORTS ================= */

import {

    initializeApp

}

from

"https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";



import {

    getAuth,

    signInWithEmailAndPassword,

    createUserWithEmailAndPassword,

    signInWithPopup,

    GoogleAuthProvider,

    signOut,

    onAuthStateChanged

}

from

"https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";



import {

    getFirestore,

    doc,

    getDoc,

    setDoc,

    collection,

    query,

    where,

    getDocs,

    serverTimestamp

}

from

"https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";



/* ================= FIREBASE CONFIG ================= */

const firebaseConfig = {

    apiKey:
    "AIzaSyBFmMidgKqXIkc339It9Papd9-vMgJpQrw",

    authDomain:
    "my-signup-app-43246.firebaseapp.com",

    projectId:
    "my-signup-app-43246",

    storageBucket:
    "my-signup-app-43246.firebasestorage.app",

    messagingSenderId:
    "940632201907",

    appId:
    "1:940632201907:web:59405d4121907b4a6faec6"

};



/* ================= INITIALIZE ================= */

const app =
initializeApp(
    firebaseConfig
);


const auth =
getAuth(
    app
);


const db =
getFirestore(
    app
);


const googleProvider =
new GoogleAuthProvider();



/* ================= ELEMENTS ================= */

const guestView =
document.getElementById(
    "guestView"
);


const bookingView =
document.getElementById(
    "bookingView"
);


const authForm =
document.getElementById(
    "authForm"
);


const emailInput =
document.getElementById(
    "email"
);


const passwordInput =
document.getElementById(
    "password"
);


const authTitle =
document.getElementById(
    "authTitle"
);


const authDescription =
document.getElementById(
    "authDescription"
);


const authSubmitBtn =
document.getElementById(
    "authSubmitBtn"
);


const switchText =
document.getElementById(
    "switchText"
);


const switchBtn =
document.getElementById(
    "switchBtn"
);


const googleBtn =
document.getElementById(
    "googleBtn"
);


const authMessage =
document.getElementById(
    "authMessage"
);


const logoutBtn =
document.getElementById(
    "logoutBtn"
);


const bookingTable =
document.getElementById(
    "bookingTable"
);


const userEmail =
document.getElementById(
    "userEmail"
);


const refreshBtn =
document.getElementById(
    "refreshBtn"
);



let isSignupMode =
false;


let currentUser =
null;



/* ================= SWITCH LOGIN / SIGNUP ================= */

switchBtn.addEventListener(

    "click",

    () => {


        isSignupMode =
        !isSignupMode;


        authMessage.innerText =
        "";


        if(isSignupMode){


            authTitle.innerText =
            "Create Account";


            authDescription.innerText =
            "Join Glamora and book your beauty appointments.";


            authSubmitBtn.innerText =
            "Create Account";


            switchText.innerText =
            "Already have an account?";


            switchBtn.innerText =
            "Sign In";


        }

        else{


            authTitle.innerText =
            "Welcome to Glamora";


            authDescription.innerText =
            "Sign in to view your beauty appointments.";


            authSubmitBtn.innerText =
            "Sign In";


            switchText.innerText =
            "Don't have an account?";


            switchBtn.innerText =
            "Create Account";


        }


    }

);



/* ================= EMAIL LOGIN / SIGNUP ================= */

authForm.addEventListener(

    "submit",

    async e => {


        e.preventDefault();


        const email =
        emailInput.value.trim();


        const password =
        passwordInput.value;


        try{


            authMessage.style.color =
            "#ffc107";


            authMessage.innerText =
            isSignupMode
            ? "Creating account..."
            : "Signing in...";



            /* SIGNUP */

            if(isSignupMode){


                if(password.length < 6){

                    throw new Error(
                        "Password must be at least 6 characters."
                    );

                }


                const credential =

                await createUserWithEmailAndPassword(

                    auth,

                    email,

                    password

                );


                const user =
                credential.user;



                /* CREATE USER ROLE */

                await setDoc(

                    doc(
                        db,
                        "users",
                        user.uid
                    ),

                    {

                        email:
                        user.email,


                        role:
                        "user",


                        createdAt:
                        serverTimestamp()

                    }

                );


                authMessage.style.color =
                "#67e480";


                authMessage.innerText =
                "Account created successfully!";


            }



            /* LOGIN */

            else{


                await signInWithEmailAndPassword(

                    auth,

                    email,

                    password

                );


            }


        }


        catch(error){


            console.error(error);


            authMessage.style.color =
            "#ff6b6b";


            authMessage.innerText =
            getFirebaseError(
                error.code
            ) ||
            error.message;


        }


    }

);



/* ================= GOOGLE LOGIN ================= */

googleBtn.addEventListener(

    "click",

    async () => {


        try{


            authMessage.style.color =
            "#ffc107";


            authMessage.innerText =
            "Opening Google...";


            const result =

            await signInWithPopup(

                auth,

                googleProvider

            );


            const user =
            result.user;



            /* CHECK USER EXISTS */

            const userRef =
            doc(
                db,
                "users",
                user.uid
            );


            const userSnap =
            await getDoc(
                userRef
            );



            /* NEW GOOGLE USER */

            if(!userSnap.exists()){


                await setDoc(

                    userRef,

                    {

                        email:
                        user.email,


                        role:
                        "user",


                        createdAt:
                        serverTimestamp()

                    }

                );


            }


        }


        catch(error){


            console.error(error);


            authMessage.style.color =
            "#ff6b6b";


            authMessage.innerText =
            error.message;


        }


    }

);



/* ================= AUTH CHECK ================= */

onAuthStateChanged(

    auth,

    async user => {


        if(!user){


            currentUser =
            null;


            guestView.style.display =
            "block";


            bookingView.style.display =
            "none";


            logoutBtn.style.display =
            "none";


            return;


        }



        currentUser =
        user;



        /* ================= GET ROLE ================= */

        try{


            const userRef =
            doc(
                db,
                "users",
                user.uid
            );


            const userSnap =
            await getDoc(
                userRef
            );



            /* USER DOCUMENT MISSING */

            if(!userSnap.exists()){


                await setDoc(

                    userRef,

                    {

                        email:
                        user.email,


                        role:
                        "user",


                        createdAt:
                        serverTimestamp()

                    }

                );


            }



            const userData =

            userSnap.exists()

            ? userSnap.data()

            : {

                role:
                "user"

            };



            /* ================= ADMIN ================= */

            if(

                userData.role ===
                "admin"

            ){


                window.location.href =
                "admin-dashboard.html";


                return;


            }



            /* ================= NORMAL USER ================= */

            guestView.style.display =
            "none";


            bookingView.style.display =
            "block";


            logoutBtn.style.display =
            "inline-block";


            userEmail.innerText =
            user.email;


            loadBookings(
                user.uid
            );


        }


        catch(error){


            console.error(
                "Role error:",
                error
            );


        }


    }

);



/* ================= LOAD BOOKINGS ================= */

async function loadBookings(
    uid
){


    bookingTable.innerHTML =
    `

    <tr>

        <td colspan="6">

            Loading bookings...

        </td>

    </tr>

    `;


    try{


        const q =

        query(

            collection(
                db,
                "bookings"
            ),

            where(
                "customerId",
                "==",
                uid
            )

        );


        const snapshot =
        await getDocs(q);



        bookingTable.innerHTML =
        "";



        if(snapshot.empty){


            bookingTable.innerHTML =
            `

            <tr>

                <td colspan="6">

                    No bookings found.

                </td>

            </tr>

            `;


            return;


        }



        snapshot.forEach(
            bookingDoc => {


                const booking =
                bookingDoc.data();


                const status =
                booking.status ||
                "Pending";


                const statusClass =
                status
                .toLowerCase()
                .trim();


                bookingTable.innerHTML +=
                `

                <tr>


                    <td>

                        <span
                        class="booking-id">

                            ${bookingDoc.id.substring(0,8)}

                        </span>

                    </td>



                    <td>

                        ${booking.service || "-"}

                    </td>



                    <td>

                        ${booking.staff || "-"}

                    </td>



                    <td>

                        ${booking.date || "-"}

                    </td>



                    <td>

                        ${booking.time || "-"}

                    </td>



                    <td>

                        <span
                        class="
                        badge
                        ${statusClass}
                        ">

                            ${status}

                        </span>

                    </td>


                </tr>

                `;


            }

        );


    }


    catch(error){


        console.error(error);


        bookingTable.innerHTML =
        `

        <tr>

            <td colspan="6">

                Error loading bookings:
                ${error.message}

            </td>

        </tr>

        `;


    }


}



/* ================= REFRESH ================= */

refreshBtn.addEventListener(

    "click",

    () => {


        if(currentUser){


            loadBookings(
                currentUser.uid
            );


        }


    }

);



/* ================= LOGOUT ================= */

logoutBtn.addEventListener(

    "click",

    async () => {


        await signOut(
            auth
        );


    }

);



/* ================= ERROR MESSAGE ================= */

function getFirebaseError(
    code
){


    switch(code){


        case "auth/invalid-email":

            return
            "Please enter a valid email address.";



        case "auth/invalid-credential":

            return
            "Incorrect email or password.";



        case "auth/email-already-in-use":

            return
            "This email is already registered.";



        case "auth/weak-password":

            return
            "Password must be at least 6 characters.";



        default:

            return null;


    }


}


</script>


</body>

</html>
